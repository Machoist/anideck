# Builds the Windows installer and publishes it as a GitHub Release.
# Trigger: push a tag like v1.1.0  (git tag v1.1.0 && git push origin v1.1.0)
# Installed copies notify users and link to GitHub for manual installation.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check code for errors
        shell: bash
        run: |
          node --check main.js
          node --check preload.js
          for f in src/api.js src/player.js src/app.js; do
            node -e "new Function(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"
          done

      # The tag decides the version, so you never have to edit package.json by hand.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # All builds use the checked-in public configuration. Personal server and webhook secrets are never injected.
      - name: Test behavior and release privacy
        run: npm test

      - name: Build and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

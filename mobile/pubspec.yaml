name: anideck_mobile
description: "AniDeck mobile playback feasibility prototype."
publish_to: 'none'
version: 0.1.10+11

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: 6.2.0-beta.3
  flutter_secure_storage: 11.2.0
  html: ^0.15.7
  http: ^1.6.0
  material_ui: ^1.11.1
  path: ^1.9.1
  sqflite: ^2.4.6
  video_player: ^2.14.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.9.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/app-icon.png
    - assets/preview.vtt
